[project]
name = "yoink"
version = "0.1.0"
description = "Local web UI for yt-dlp: downloads, playlists, subscriptions, credential vault"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2026.6.9",
    "cryptography>=43",
]

[project.scripts]
yoink = "yoink.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yoink"]
