name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build tools
        run: >
          dnf -y install git-core nodejs npm rpm-build rpmdevtools
          desktop-file-utils gh python3-devel python3-hatchling python3-pip
          python3-pytest python3-httpx python3-fastapi python3-uvicorn
          python3-websockets python3-cryptography yt-dlp

      - uses: actions/checkout@v4

      - name: Build source tarball (includes frontend build)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash packaging/make-source-tarball.sh "$PWD/rpmbuild/SOURCES"

      - name: Build RPM
        run: rpmbuild -ba packaging/yoink.spec --define "_topdir $PWD/rpmbuild"

      - name: Attach RPM to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "See README for install instructions (RPM Fusion ffmpeg note)." \
            2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" rpmbuild/RPMS/noarch/*.rpm --clobber
