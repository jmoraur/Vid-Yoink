name: ci

# Every branch push (tags are handled by release.yml).
on:
  push:
    branches: ['**']

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install uv
      - run: uv sync --frozen
      - run: uv run ruff check yoink/ tests/
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build  # runs tsc first
      - run: npm run check  # wording helpers (plain Node)
